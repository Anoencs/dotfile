# Terminal compatibility settings for Linux
# Use 256-color support for tmux sessions in Linux
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Unbind the default prefix key
unbind C-b

# Set the new prefix key to Ctrl-Space (This works on Linux too)
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes with index 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Bind Alt-H to previous window and Alt-L to next window
# On Linux, Alt keys typically work as expected in most terminal emulators
bind -n M-H previous-window
bind -n M-L next-window
# w3m config
bind-key W split-window -h "w3m https://duckduckgo.com"
# Plugin configuration
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'light'

set-option -g mouse on

# Initialize TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @resurrect-capture-pane-contents 'on' # allow tmux-resurrect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Image
# Fix cursor shape escape sequences
set -g terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Better terminal settings
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Fix cursor issues in neovim
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -ga terminal-overrides "*:cvvis=\E[34l\E[?25h"

# Enable passthrough for images
set -g allow-passthrough on
# Initialize TPM (Tmux Plugin Manager)
run '~/.tmux/plugins/tpm/tpm'

